spring.application.name=Warehouse Dispatcher
spring.profiles.active=dev

# Shared Timefold configuration
timefold.solver.termination.spent-limit=10s

# Hibernate / Flyway global defaults
spring.flyway.baseline-on-migrate=true

# Keep this to allow your Java Seeder to run after Flyway creates tables
spring.jpa.defer-datasource-initialization=false

# Springdoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOut.enabled=true
springdoc.swagger-ui.display-request-duration=true
