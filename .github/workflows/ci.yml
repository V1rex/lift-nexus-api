name: Continuous Integration

on:
  push:
    branches: [develop, main, 'devops/**']
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    name: Compile and Verify Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'


      - name: Set up Python for MkDocs
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: "pip"
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements-docs.txt

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Execute Test Suite with Maven
        run: mvn clean package -Dspotless.check.skip=false -Dcheckstyle.failOnViolation=false
        timeout-minutes: 15

      - name: Evaluate Build Status
        id: build-status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "build_status=passing" >> $GITHUB_OUTPUT
            echo "build_color=brightgreen" >> $GITHUB_OUTPUT
          else
            echo "build_status=failing" >> $GITHUB_OUTPUT
            echo "build_color=red" >> $GITHUB_OUTPUT
          fi
      - name: Build MkDocs documentation
        run: mkdocs build
      - name: Calculate Service Doc Coverage Percentage
        id: calc-doc-coverage
        if: always()
        run: |
          TOTAL_ELEMENTS=0
          while read -r file; do
            if [ -f "$file" ]; then
              COUNT=$(grep -E -c "public (class|interface|void|[A-Z][a-zA-Z0-9_<>]*)" "$file" || echo 0)
              TOTAL_ELEMENTS=$((TOTAL_ELEMENTS + COUNT))
            fi
          done < <(find src/main/java -type f \( -path "*/service/*" -o -name "*Service.java" \))

          echo "Total Service Elements: $TOTAL_ELEMENTS"

          MISSING_DOCS=0
          if [ -f target/checkstyle-result.xml ]; then
            MISSING_METHODS=$(grep -c "MissingJavadocMethod" target/checkstyle-result.xml || echo 0)
            MISSING_VARS=$(grep -c "JavadocVariable" target/checkstyle-result.xml || echo 0)
            MISSING_DOCS=$((MISSING_METHODS + MISSING_VARS))
          fi
          echo "Missing Service Javadocs: $MISSING_DOCS"

          if [ "$TOTAL_ELEMENTS" -gt 0 ]; then
            if [ "$MISSING_DOCS" -gt "$TOTAL_ELEMENTS" ]; then
              COVERAGE=0
            else
              COVERAGE=$(( (TOTAL_ELEMENTS - MISSING_DOCS) * 100 / TOTAL_ELEMENTS ))
            fi
          else
            COVERAGE=100
          fi

          echo "doc_percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Final Computed Coverage: ${COVERAGE}%"

          if [ "$COVERAGE" -ge 80 ]; then echo "doc_color=brightgreen" >> $GITHUB_OUTPUT;
          elif [ "$COVERAGE" -ge 50 ]; then echo "doc_color=yellow" >> $GITHUB_OUTPUT;
          else echo "doc_color=red" >> $GITHUB_OUTPUT; fi

      - name: Parse JaCoCo Test Coverage
        id: jacoco-coverage
        if: always()
        run: |
          JACOCO_XML="target/site/jacoco/jacoco.xml"
          if [ -f "$JACOCO_XML" ]; then
            LINE_INFO=$(tail -n 15 "$JACOCO_XML" | grep 'type="LINE"' || true)
            MISSED=$(echo "$LINE_INFO" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p' || echo 0)
            COVERED=$(echo "$LINE_INFO" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p' || echo 0)

            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -gt 0 ]; then
              PERCENT=$((COVERED * 100 / TOTAL))
            else
              PERCENT=0
            fi
          else
            echo "JaCoCo report missing, fallback to 0%"
            PERCENT=0
          fi

          echo "test_percentage=$PERCENT" >> $GITHUB_OUTPUT
          echo "Total Verified Test Coverage: ${PERCENT}%"

          if [ "$PERCENT" -ge 85 ]; then echo "test_color=brightgreen" >> $GITHUB_OUTPUT;
          elif [ "$PERCENT" -ge 70 ]; then echo "test_color=green" >> $GITHUB_OUTPUT;
          elif [ "$PERCENT" -ge 50 ]; then echo "test_color=yellow" >> $GITHUB_OUTPUT;
          else echo "test_color=red" >> $GITHUB_OUTPUT; fi

      - name: Generate Dynamic Build Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 27dc15f2c2aeef4b021fdff63d7ba722
          filename: lift-nexus-metrics.json
          label: build
          message: ${{ steps.build-status.outputs.build_status || 'failing' }}
          color: ${{ steps.build-status.outputs.build_color || 'red' }}

      - name: Generate Dynamic Doc Badges
        uses: schneegans/dynamic-badges-action@v1.7.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 27dc15f2c2aeef4b021fdff63d7ba722
          filename: lift-nexus-docs.json
          label: doc coverage
          message: "${{ steps.calc-doc-coverage.outputs.doc_percentage || '0' }}%"
          color: ${{ steps.calc-doc-coverage.outputs.doc_color || 'red' }}

      - name: Generate Dynamic Test Coverage Badges
        uses: schneegans/dynamic-badges-action@v1.7.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 27dc15f2c2aeef4b021fdff63d7ba722
          filename: lift-nexus-coverage.json
          label: test coverage
          message: "${{ steps.jacoco-coverage.outputs.test_percentage || '0' }}%"
          color: ${{ steps.jacoco-coverage.outputs.test_color || 'red' }}

      - name: Upload Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-dispatcher-build-assets
          path: |
            target/*.jar
            target/openapi.json
          retention-days: 7

      - name: Prepare GitHub Pages
        if: github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, 'refs/heads/devops/')
        run: |
          mkdir -p gh-pages/coverage gh-pages/javadoc gh-pages/tests gh-pages/site

          # Landing page + API docs
          cp docs/index.html gh-pages/
          cp docs/api.html gh-pages/
          cp target/openapi.json gh-pages/
          
          # custom domain 
          echo "lift-nexus.amine-bahij.dev" > gh-pages/CNAME
          
          # Static assets for landing page
          if [ -d docs/assets ]; then
            cp -r docs/assets gh-pages/assets
          fi
          
          if [ -d build/site ]; then
            cp -r build/site/* gh-pages/site/
          fi

          # JaCoCo coverage report
          if [ -d target/site/jacoco ]; then
            cp -r target/site/jacoco/* gh-pages/coverage/
          fi

          # Javadoc (with doclint disabled for CI resilience)
          mvn javadoc:javadoc -Dquiet=true -Ddoclint=none -Dcheckstyle.skip=true -Dspotless.check.skip=true
          if [ -d target/site/apidocs ]; then
            cp -r target/site/apidocs/* gh-pages/javadoc/
          fi

          # Surefire test reports
          if [ -d target/surefire-reports ]; then
            cp -r target/surefire-reports/* gh-pages/tests/
          fi

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, 'refs/heads/devops/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
