name: Continuous Integration

on:
  push:
    branches: [develop, main, 'devops/**']
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    name: Compile and Verify Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python for MkDocs
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: "pip"
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements-docs.txt


      - name: Execute Test Suite with Maven
        run: mvn clean package -Dspotless.check.skip=false -Dcheckstyle.failOnViolation=false
        timeout-minutes: 15

      - name: Evaluate Build Status
        id: build-status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "build_status=passing" >> $GITHUB_OUTPUT
            echo "build_color=brightgreen" >> $GITHUB_OUTPUT
          else
            echo "build_status=failing" >> $GITHUB_OUTPUT
            echo "build_color=red" >> $GITHUB_OUTPUT
          fi




      - name: Build MkDocs documentation
        run: mkdocs build

      - name: Calculate Service Doc Coverage Percentage
        id: calc-doc-coverage
        if: always()
        run: python scripts/ci/javadoc_coverage.py

      - name: Calculate JaCoCo Test Coverage
        id: jacoco-coverage
        if: always()
        run: python scripts/ci/jacoco_coverage.py

      - name: Generate Javadoc
        run: |
          mvn javadoc:javadoc \
            -Dquiet=true \
            -Ddoclint=none \
            -Dcheckstyle.skip=true \
            -Dmaven.checkstyle.skip=true \
            -Dspotless.check.skip=true
      
          echo "Checking generated Javadoc folders..."
          find target -maxdepth 4 -type d | sort | grep -E "apidocs|javadoc|site" || true
          test -f target/reports/apidocs/index.html

      - name: Generate Dynamic Build Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 27dc15f2c2aeef4b021fdff63d7ba722
          filename: lift-nexus-metrics.json
          label: build
          message: ${{ steps.build-status.outputs.build_status || 'failing' }}
          color: ${{ steps.build-status.outputs.build_color || 'red' }}

      - name: Generate Dynamic Doc Badges
        uses: schneegans/dynamic-badges-action@v1.7.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 27dc15f2c2aeef4b021fdff63d7ba722
          filename: lift-nexus-docs.json
          label: doc coverage
          message: "${{ steps.calc-doc-coverage.outputs.doc_percentage || '0' }}%"
          color: ${{ steps.calc-doc-coverage.outputs.doc_color || 'red' }}

      - name: Generate Dynamic Test Coverage Badges
        uses: schneegans/dynamic-badges-action@v1.7.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 27dc15f2c2aeef4b021fdff63d7ba722
          filename: lift-nexus-coverage.json
          label: test coverage
          message: "${{ steps.jacoco-coverage.outputs.test_percentage || '0' }}%"
          color: ${{ steps.jacoco-coverage.outputs.test_color || 'red' }}

      - name: Upload Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-dispatcher-build-assets
          path: |
            target/*.jar
            target/openapi.json
          retention-days: 7

      - name: Prepare GitHub Pages
        if: github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, 'refs/heads/devops/')
        run: bash scripts/ci/prepare_pages.sh


      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, 'refs/heads/devops/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
